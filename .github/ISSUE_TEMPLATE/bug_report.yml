name: Segnalazione / Bug
description: Segnala un problema nel codice PoC o proponi una miglioria
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie per la segnalazione. Per questioni di sicurezza sensibili non
        usare questo modulo: vedi `SECURITY.md`.
  - type: textarea
    id: what
    attributes:
      label: Descrizione
      description: Cosa succede e cosa ti aspettavi.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Passi per riprodurre
      description: Comandi e output rilevanti.
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Ambiente
      description: Dove esegui il codice (versione OS, Python, target di lab, ...).
    validations:
      required: false
